# HAK service configuration (see hak.toml.example).
# Precedence: environment variable > this file > built-in default.

# Bind the LAN interface so other seats/hosts can reach the UI and API at
# http://192.168.178.203:8890/ — the operator's explicit trust decision.
host = "0.0.0.0"

port = 8890

# In-process GC sweep (D18/D23) and wake-delivery worker (D50).
sweep_interval = 3600
wake_poll_sec = 2
